[server]
# §23 — expose le dossier `static/` de la racine de l'application sur `/app/static/`. C'est ce qui
# permet au bouton « Page de présentation » de la barre latérale (ui.py) d'ouvrir
# `static/landing.html` sans copier le fichier ni le dupliquer : un seul fichier, une seule URL,
# aucune dérive possible entre deux exemplaires. Lu au DÉMARRAGE du serveur — l'activer sur une
# instance déjà lancée demande un redémarrage.
# Conservé par `branding.merge_config_toml()` : seules les sections `[theme…]` sont réécrites lors
# d'un enregistrement depuis « Réglages → Apparence ».
enableStaticServing = true

# ─────────────────────────────────────────────────────────────────────────────
# Section [theme] GÉNÉRÉE par aca/core/branding.py (onglet « Réglages » → Apparence).
# Toute modification manuelle ici sera écrasée au prochain enregistrement de la marque.
# Les autres sections du fichier (server, client, browser…) sont préservées telles quelles.
# ─────────────────────────────────────────────────────────────────────────────
[theme]
base = "light"
primaryColor = "#125E6B"
backgroundColor = "#F1F4F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#12171C"
linkColor = "#125E6B"
borderColor = "#D5DDE0"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "12px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
baseFontSize = 14
linkUnderline = false
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [650, 640, 620, 600, 600, 600]
chartCategoricalColors = ["#125E6B", "#1F6F4A", "#B4622A", "#A32C1E", "#63604A", "#76A2A9", "#CFA485", "#12454F"]
blueColor = "#125E6B"
greenColor = "#1F6F4A"
redColor = "#A32C1E"
orangeColor = "#B4622A"
violetColor = "#B4622A"
dataframeBorderColor = "#D5DDE0"
dataframeHeaderBackgroundColor = "#FFFFFF"

[theme.sidebar]
backgroundColor = "#E9EEEF"
secondaryBackgroundColor = "#DCE1E2"
textColor = "#12171C"
borderColor = "#D5DDE0"
primaryColor = "#125E6B"
